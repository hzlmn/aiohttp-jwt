name: Build, Lint & Test

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    secrets:
      GH_APP_ID:
        required: true
      GH_APP_PRIVATE_KEY:
        required: true
      SONAR_TOKEN:
        required: true
  workflow_dispatch:

concurrency:
  group: test-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  DOCKER_BUILDKIT: 1
  ECR_REGISTRY: 133824686826.dkr.ecr.eu-west-1.amazonaws.com
  AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}

permissions:
  id-token: write
  contents: read

jobs:
  test:
    # NOTE: Self-hosted runners with pull_request trigger require the repo to remain private with forks disabled.
    runs-on: self-hosted-arm-8gi
    timeout-minutes: 30
    name: Test across supported Python versions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate GitHub App Token
        id: generate_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: "tenproduct"

      - name: Install AWS CLI in the runner
        run: |
          if ! command -v aws &> /dev/null; then
            echo "Installing AWS CLI..."
            curl "https://awscli.amazonaws.com/awscli-exe-linux-aarch64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install --update
            rm -rf aws awscliv2.zip
          fi
          aws --version

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Docker Compose
        run: |
          if ! command -v docker-compose &> /dev/null; then
            echo "Installing docker-compose..."
            sudo curl -L "https://github.com/docker/compose/releases/download/v2.29.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
            sudo chmod +x /usr/local/bin/docker-compose
          fi
          docker-compose version

      - name: Build Docker image
        run: |
          set -xeuo pipefail

          docker buildx build \
            --platform linux/arm64 \
            --load \
            -t tenproduct/aiohttp_jwt \
            --progress plain .

      - name: Run tests
        run: |
          set -xeuo pipefail
          docker-compose run --name test_runner aiohttp_jwt

      - name: Extract coverage report
        if: always()
        run: |
          docker cp test_runner:/var/aiohttp-jwt/htmlcov ./htmlcov || echo "::warning::Failed to extract HTML coverage report"
          docker cp test_runner:/var/aiohttp-jwt/coverage.xml ./coverage.xml || echo "::warning::Failed to extract coverage.xml"
          docker rm test_runner || true

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            htmlcov
            coverage.xml
          if-no-files-found: warn

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
