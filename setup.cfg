[flake8]
exclude =
    __pycache__
    .backups
    .git
    .idea
    .pytest_cache
    .ssh
    .tox
    venv
    .venv
    config
max-line-length = 119
max-complexity = 12
doctests = True
statistics = True
benchmark = True
ignore = E131,D101,D102,D202,C901,D100,D103,D104,D106,D107,W503,N802,E203

[isort]
skip =
    __pycache__
    .backups
    .git
    .idea
    .pytest_cache
    .ssh
    .tox
    venv
    .venv
    config
profile = black
multi_line_output=3
include_trailing_comma=True
line_length = 119

[coverage:run]
relative_files = true
omit =
    tests/*

[tool:pytest]
addopts = --showlocals -p no:warnings
python_files = tests.py test_*.py *_tests.py
python_functions = test_*

[tox:tox]
env_list =
    py312
    py311
    py310
    lint
    format
minversion = 4.11

[testenv]
description = run unit, format, and lint tests
passenv = *
deps =
    -r requirements.txt
commands =
    python setup.py check --strict --metadata
    flake8 aiohttp_jwt tests setup.py
    isort --check aiohttp_jwt tests setup.py
    pytest {tty:--color=yes} {posargs}
    coverage report --show-missing

[testenv:lint]
skip_install = true
commands =
    flake8 aiohttp_jwt tests setup.py
    isort --check aiohttp_jwt tests setup.py

[testenv:format]
skip_install = true
commands =
    isort aiohttp_jwt tests setup.py
