[tool.poetry]
name = "aiohttp-jwt"
version = "0.7.2"
description = "Provides `aiohttp` middleware and helper utils for working with JSON web tokens."
authors = ["Ten Product <product@tengroup.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
aiohttp = ">=3.10.5"
PyJWT = ">=2.9.0"

[tool.poetry.dev-dependencies]
pytest = ">=7.2.0"
pytest-aiohttp = ">=1.0.5"
pytest-asyncio = ">=0.23.8"
pytest-cov = "^4.1.0"
pytest-mock = ">=3.14.0"
tox = "^4.24.1"
flake8 = "*"
isort = "*"
black = ">=24.3.0"
