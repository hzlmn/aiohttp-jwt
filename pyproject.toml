[tool.poetry]
name = "aiohttp-jwt"
version = "0.7.2"
description = "Provides `aiohttp` middleware and helper utils for working with JSON web tokens."
authors = ["Ten Product <product@tengroup.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.9"
aiohttp = "=3.10.5"
async-timeout = "=4.0.3"
atomicwrites = "=1.4.1"
attrs = "=24.2.0"
chardet = "=5.2.0"
idna = "=3.7"
idna-ssl = "=1.1.0"
more-itertools = "=10.4.0"
multidict = "=4.5.2"
PyJWT = "=2.9.0"
six = "=1.16.0"
yarl = "~1.17.0"

[tool.poetry.dev-dependencies]
pytest = "=8.3.2"
pytest-aiohttp = "=1.0.5"
pytest-asyncio = "=0.23.8"
pytest-cov = "=5.0.0"
pytest-mock = "=3.14.0"
coverage = "=7.6.1"
flake8 = "=7.1.1"
isort = "=5.13.2"
mccabe = "=0.7.0"
pluggy = "=1.5.0"
py = "=1.11.0"
pycodestyle = "=2.12.1"
pyflakes = "=3.2.0"
